[project]
name = "personal-memory-agent"
version = "0.1.0"
description = "Local LLM based personal memory storage, search and chat"
requires-python = ">=3.14,<3.15"
dependencies = [
    "requests",
    "jsonschema",
    "fastapi>=0.118.3,<1",
    "uvicorn>=0.35,<1",
    "numpy>=2.3.3,<3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
